<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frota">
<title>Registros da Frota</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#14181f;--mut:#667085;--bd:#d6dbe1;--pri:#1f7a4d;--priTxt:#fff;--err:#b42318;--errBg:#fee4e2;--warn:#7a5b00;--warnBg:#fff4cc;--ok:#067647;--okBg:#d1fadf}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#1a1f29;--txt:#f2f4f7;--mut:#98a2b3;--bd:#344054;--pri:#2a9d68;--err:#fda29b;--errBg:#3b1511;--warn:#fedf89;--warnBg:#3a2d05;--ok:#75e0a7;--okBg:#0c2e1c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
h1{font-size:1.5rem;margin:.4rem 0 1rem}h2{font-size:1.2rem;margin:1rem 0 .5rem}
label{display:block;margin:.9rem 0 .3rem;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:.8rem .75rem;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--txt);min-height:3.1rem}
textarea{min-height:5rem}
button{font:inherit;font-weight:700;min-height:3.2rem;padding:.6rem .9rem;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--txt);width:100%;cursor:pointer}
button.pri{background:var(--pri);color:var(--priTxt);border-color:var(--pri)}
button.perigo{color:var(--err)}button:disabled{opacity:.5}
.linha{display:flex;gap:10px;align-items:center}.linha>*{flex:1}.linha>.fixo{flex:none}
.grade3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grade3 button{min-height:5.2rem;font-size:1.02rem}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:.6rem}.barra button{width:auto;min-height:2.6rem}
.chip{font-size:.8rem;padding:.15rem .5rem;border-radius:999px;margin-left:.3rem;font-weight:700}.chip.ok{background:var(--okBg);color:var(--ok)}.chip.off{background:var(--warnBg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:.8rem;margin:.6rem 0}
.aviso,.erro,.ok,.info{padding:.7rem .8rem;border-radius:12px;margin:.6rem 0;font-size:.95rem}
.aviso,.info{background:var(--warnBg);color:var(--warn)}.erro{background:var(--errBg);color:var(--err)}.ok{background:var(--okBg);color:var(--ok)}
.aviso button{margin-top:.5rem;min-height:2.6rem}
.peq{color:var(--mut);font-size:.88rem;margin:.3rem 0}.chk{display:flex;gap:.6rem;align-items:center;font-weight:500}.chk input{width:1.4rem;min-height:1.4rem}
.passo{display:flex;align-items:center;gap:8px}.passo input{text-align:center;font-weight:700;font-size:1.2rem}.passo button{width:3.4rem;flex:none;font-size:1.4rem}
.metr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.6rem 0}.metr div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.5rem;text-align:center}
.metr b{display:block;font-size:1.15rem}.metr span{font-size:.78rem;color:var(--mut)}
.miniaturas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:.6rem}.mini{position:relative}.mini img{width:100%;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}.mini .x{position:absolute;top:4px;right:4px;width:2rem;min-height:2rem;padding:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:1rem}
img.prev{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:.6rem;border:1px solid var(--bd)}
.st{font-size:.9rem;font-weight:700;margin:.25rem 0}
</style>
</head>
<body>
<div id="app"><p>Carregando…</p></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
